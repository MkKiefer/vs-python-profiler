version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-dev: { dependency-type: development }
