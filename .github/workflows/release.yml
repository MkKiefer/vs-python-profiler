name: Release
# Push a tag "vX.Y.Z" whose version matches package.json and
# python/pyproject.toml, on a commit that is on the default branch:
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
on:
  push:
    tags: ['v*']

# Every job starts with no token permissions and asks only for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: tag matches the project versions and is on the default branch
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not of the form vX.Y.Z"; exit 1
          fi
          version="${TAG#v}"
          extension=$(node -p "require('./package.json').version")
          collector=$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml', 'rb'))['project']['version'])")
          [[ "$extension" == "$version" ]] || { echo "::error::package.json is $extension, tag is $TAG"; exit 1; }
          [[ "$collector" == "$version" ]] || { echo "::error::python/pyproject.toml is $collector, tag is $TAG"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" \
            || { echo "::error::$TAG is not on $DEFAULT_BRANCH"; exit 1; }

  # The full CI (tests on all platforms) and the .vsix build, read-only.
  ci:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # The only job with write access. It runs no repository code: it downloads
  # the artifact built above, attests it and attaches it to the release.
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure required reviewers / tag restrictions for this environment in
    # Settings -> Environments to gate every release.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: vsix, path: dist }
      - name: checksum
        working-directory: dist
        run: sha256sum -- *.vsix | tee SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.vsix
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.vsix dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
