name: CI
on:
  push:
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  collector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}', allow-prereleases: true }
      # macOS needs root to read another process's memory
      - name: e2e (macOS, sudo)
        if: runner.os == 'macOS'
        run: sudo -E python -W ignore python/tests/test_e2e.py
      - name: e2e
        if: runner.os != 'macOS'
        run: python -W ignore python/tests/test_e2e.py
